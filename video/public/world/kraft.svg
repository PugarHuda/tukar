<?xml version="1.0" encoding="UTF-8"?>
<!-- Tukar, The Balikbayan Parcel. Kraft corrugate ground tile: paper grain from fractal noise plus
     one flute shadow every 9px. Authored by hand as SVG on 2026-08-28; no image generator involved.
     Tiles seamlessly at 256x256. -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="7" stitchTiles="stitch" result="n" />
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.09  0 0 0 0 0.07  0 0 0 0 0.05  0 0 0 0.16 0" />
    </filter>
    <pattern id="flute" width="256" height="9" patternUnits="userSpaceOnUse">
      <rect x="0" y="7.4" width="256" height="1.2" fill="#161311" fill-opacity="0.075" />
      <rect x="0" y="0.6" width="256" height="0.8" fill="#fff2dc" fill-opacity="0.10" />
    </pattern>
  </defs>
  <rect width="256" height="256" fill="#d4a468" />
  <rect width="256" height="256" filter="url(#grain)" />
  <rect width="256" height="256" fill="url(#flute)" />
</svg>
