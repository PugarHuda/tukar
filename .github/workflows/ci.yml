name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pool-contract:
    name: Pool contract (cargo test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Test pool contract
        working-directory: contracts/pool
        run: cargo test

  proving-flow:
    name: In-browser proving flow (snarkjs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      # Frontend unit tests — the client Merkle tree (frontend/tree.js): empty root
      # must equal the deployed genesis, inclusion proofs must reconstruct. Pure,
      # deterministic, no browser/network.
      - run: node scripts/test-unit.mjs
      # Uses the committed disclosure circuit artifacts (frontend/circuit/*) —
      # no circom needed. Validates valid / tampered / false-witness behaviour.
      - run: node scripts/test-fullprove.mjs
      # Circuit-soundness suite (transfer + compliance): bad witnesses must be
      # rejected. Falls back to the committed frontend/circuit/* artifacts, so it
      # runs here without a fresh circom build.
      - run: node scripts/test-negative.mjs
      # Widened-ASP soundness: a multi-member allow-list built from real accounts —
      # a non-demo member proves + verifies, non-member / deny-listed are rejected,
      # and the demo-only build still reproduces the deployed root (non-breaking).
      - run: node scripts/test-asp-widened.mjs
