name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    name: Soroban contracts (cargo test)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate:
          - pool
          - policy-registry
          - reserves
          - reserves-aggregate
          - reserves-testpool
          - pool-enforced
          - pool-accumulator
          - pool-timelock
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Test ${{ matrix.crate }}
        working-directory: contracts/${{ matrix.crate }}
        run: cargo test

  webapp:
    name: Webapp (typecheck, lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: npm ci
      - name: Typecheck (strict)
        run: npx tsc --noEmit
      - name: Lint
        run: npx next lint
      - name: Unit tests (vitest)
        run: npm run test
      - name: Build
        run: npm run build

  proving-flow:
    name: In-browser proving flow (snarkjs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      # Client Merkle tree (frontend/tree.js): empty root == deployed genesis, inclusion proofs
      # reconstruct. Pure, deterministic, no browser/network.
      - run: node scripts/test-unit.mjs
      # Committed disclosure circuit artifacts (frontend/circuit/*) — no circom needed. Valid /
      # tampered / false-witness behaviour.
      - run: node scripts/test-fullprove.mjs
      # Circuit-soundness suite (transfer + compliance): bad witnesses must be rejected.
      - run: node scripts/test-negative.mjs
      # Widened-ASP soundness: a multi-member allow-list, non-member / deny-listed rejected, and
      # the demo-only build still reproduces the deployed root.
      - run: node scripts/test-asp-widened.mjs
      # Aggregate (portfolio) disclosure soundness — the completeness binding that makes an audit
      # request un-cherry-pickable: omitted payment, substituted note, wrong ctxNonce, flipped
      # active flag, over-cap and non-opening amount all have to be UNPROVABLE.
      - run: node scripts/test-aggregate.mjs

  browser:
    name: Browser E2E (Playwright, chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Root deps carry @playwright/test + @axe-core/playwright; the app is built and served
      # by Playwright's own webServer (playwright.config.ts starts `next start -p 3100` when
      # QA_BASE points at localhost).
      - run: npm ci
      - run: npm ci
        working-directory: webapp
      - run: npm run build
        working-directory: webapp
      - run: npx playwright install --with-deps chromium
      # WHAT RUNS HERE, AND WHY IT IS A SUBSET.
      # These six specs need nothing but the app itself: routes/render, axe a11y, input
      # validation, mobile overflow, and the resilience cases (which ABORT the RPC on purpose,
      # so they do not depend on testnet health). 63 tests, ~35s.
      #
      # The rest are deliberately NOT here, and the reason is not squeamishness:
      #   e2e/features.spec.ts, e2e/exhaustive.spec.ts — drive a REAL deposit signed with the
      #     shared testnet demo key (two on-chain txs + in-browser proving). Running them on
      #     every push would spend that key's USDC and collide on its sequence number between
      #     concurrent jobs (txBadSeq), so they stay a local/manual sweep.
      #   e2e/p28-live.spec.ts — the same, already opt-in behind LIVE_DEPOSIT=1.
      #   e2e/push.spec.ts — needs a real Google Chrome (Playwright's bundled Chromium has no
      #     push service) and CRON_SECRET for the operator-alert half.
      - run: npx playwright test --project=chromium e2e/a11y.spec.ts e2e/edge-inputs.spec.ts e2e/failure.spec.ts e2e/mobile.spec.ts e2e/resilience.spec.ts e2e/routes.spec.ts
        env:
          QA_BASE: http://127.0.0.1:3100
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
