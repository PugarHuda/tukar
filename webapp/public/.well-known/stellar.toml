# Tukar — SEP-1 stellar.toml
# Discovery metadata for the Tukar confidential cross-border corridor on Stellar.
#
# HONEST SCOPE: Tukar is NOT a fiat anchor. It is the private on-chain *settlement
# rail* that sits between anchors — the confidential cross-border leg. It therefore
# does NOT publish TRANSFER_SERVER / WEB_AUTH_ENDPOINT / KYC_SERVER (those belong to
# a real KYC'd anchor; the app runs SEP-10/24 against SDF's testnet reference anchor,
# with a licensed anchor pending for mainnet).
# What this file does publish is real: the network, the operating account, org info,
# and the live Soroban contracts so the corridor is discoverable per SEP-1. Where
# Tukar fits the anchor stack is SEP-31 (cross-border payments): a sending and a
# receiving anchor would handle fiat + KYC at the edges, and Tukar provides the
# amount-and-counterparty-private settlement in between.

VERSION="2.7.0"
NETWORK_PASSPHRASE="Test SDF Network ; September 2015"
ACCOUNTS=["GB2CVRVNR4VN5LYVOX637ZS46RJONKWVQZ4IZC5IIEPAPPFRC5CHYRVS"]
# SEP-7: the receiver's "Request a payment" also emits a signed web+stellar:pay URI; wallets and
# the Tukar sender verify its `signature` against this key (secret half in SEP7_SIGNING_SECRET).
URI_REQUEST_SIGNING_KEY="GDAO5PYNS334DXHTOYLE42YZ6AJJA33FAJYVIQUPQJ36WBE2SJZ35LAT"

[DOCUMENTATION]
ORG_NAME="Tukar"
ORG_DESCRIPTION="Confidential cross-border payment corridors on Stellar. USDC in, shielded transfer (amount + counterparties hidden on-chain), local fiat out — with zero-knowledge compliance proofs and selective disclosure, verified on-chain. A Privacy-Pools design; the fiat edges are public by design and assume existing anchors."
ORG_URL="https://tukar-six.vercel.app"
ORG_GITHUB="PugarHuda/tukar"

